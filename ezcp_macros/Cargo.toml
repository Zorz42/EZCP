[package]
name = "ezcp_macros"
version = "0.1.0"
edition = "2024"
description = "Procedural macros for EZCP"
license = "GPL-3.0-only"
repository = "https://github.com/Zorz42/EZCP"
rust-version = "1.88"

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
# A derive macro only ever parses a type definition, which the default features
# already cover; "full" would pull in the whole expression grammar.
syn = "2.0"
quote = "1.0"
proc-macro2 = "1.0"
