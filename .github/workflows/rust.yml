name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install stable --profile minimal --component clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.7.3

      # Linux and macOS runners ship a C++ compiler; Windows needs MinGW on PATH.
      - name: Set up MinGW
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for dir in /c/msys64/ucrt64/bin /c/msys64/mingw64/bin /c/mingw64/bin; do
            if [ -x "$dir/g++.exe" ]; then
              cygpath -w "$dir" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo "No MinGW found in the image, installing it."
          choco install mingw -y --no-progress

      - name: Show compiler version
        shell: bash
        run: g++ --version

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install 1.88 --profile minimal

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.7.3

      # --locked, so a dependency that raises its MSRV fails here. `check` is
      # enough: timer.cpp is only compiled at run time.
      - name: Check on the minimum supported Rust version
        run: cargo +1.88 check --workspace --all-targets --locked

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo fmt --all --check
