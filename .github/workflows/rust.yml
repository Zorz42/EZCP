name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Always run every platform, so one failure does not hide the others.
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install stable --profile minimal --component clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.7.3

      # EZCP shells out to g++, so the C++ toolchain is part of what is tested.
      # Linux and macOS runners already ship one; Windows needs MinGW on PATH.
      - name: Set up MinGW
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for dir in /c/msys64/ucrt64/bin /c/msys64/mingw64/bin /c/mingw64/bin; do
            if [ -x "$dir/g++.exe" ]; then
              cygpath -w "$dir" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo "No MinGW found in the image, installing it."
          choco install mingw -y --no-progress

      - name: Show compiler version
        shell: bash
        run: g++ --version

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install 1.88 --profile minimal

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.7.3

      # `rust-version` in Cargo.toml is a promise to users, and nothing else in
      # this workflow tests it: every other job runs on stable.
      #
      # --locked so this checks the committed Cargo.lock. A dependency that
      # raises its own MSRV should turn this job red rather than break someone
      # who took the crate at its word.
      #
      # `check` is enough. There is no build script, and timer.cpp is compiled
      # at run time, so nothing here needs a C++ compiler.
      - name: Check on the minimum supported Rust version
        run: cargo +1.88 check --workspace --all-targets --locked

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo fmt --all --check
