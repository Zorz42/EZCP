[package]
name = "ezcp"
version = "0.5.1"
edition = "2024"
description = "A simple tool to automatically generate test cases for competitive programming problems."
# Let chains and `zip` need 1.88.
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/Zorz42/EZCP"
keywords = ["cp", "test_data", "framework", "generator"]
categories = ["development-tools"]
readme = "README.md"
# src/tests stays in, so `cargo test` works on the published crate.
exclude = [
    ".github/",
    ".gitignore",
    "AGENTS.md",
    "rustfmt.toml",
]

[workspace]
members = ["ezcp_macros"]

[lints]
workspace = true

[dependencies]
# The version is what the published crate depends on.
ezcp_macros = { version = "0.1.0", path = "ezcp_macros" }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
# Unlike "deflate", this does not pull in zopfli, which is only used at
# compression levels this crate never asks for.
zip = { version = "8.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
thiserror = { version = "2.0", default-features = false }
which = { version = "8.0", default-features = false, features = ["real-sys"] }
console = { version = "0.16", default-features = false, features = ["unicode-width", "ansi-parsing", "std"] }
indicatif = { version = "0.18", default-features = false, features = [] }
indicatif-log-bridge = { version = "0.2", default-features = false, features = [] }
env_logger = { version = "0.11", default-features = false, features = [] }
log = { version = "0.4", default-features = false, features = [] }
dunce = { version = "1.0", default-features = false }

[dev-dependencies]
tempfile = { version = "3.20", default-features = false }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Restriction lints, which no group above enables.
assertions_on_result_states = "warn"
create_dir = "warn"
decimal_literal_representation = "warn"
deref_by_slicing = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
expect_used = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
impl_trait_in_params = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
mixed_read_write_in_expression = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
needless_raw_strings = "warn"
non_ascii_literal = "warn"
panic = "warn"
pub_without_shorthand = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
semicolon_inside_block = "warn"
single_char_lifetime_names = "warn"
str_to_string = "warn"
try_err = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
verbose_file_reads = "warn"

cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
suboptimal_flops = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
ptr_as_ptr = "allow"
many_single_char_names = "allow"
significant_drop_tightening = "allow"
new_without_default = "allow"
module_inception = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
struct_field_names = "allow"
iter_without_into_iter = "allow"
multiple_crate_versions = "allow"
missing_safety_doc = "allow"
cargo_common_metadata = "allow"
zero_ptr = "allow"
assigning_clones = "allow"

# No `panic = "abort"`: serve mode catches panicking generators.
[profile.release]
lto = true
codegen-units = 1
strip = true
